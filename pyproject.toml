[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ampere-public-results"
version = "0.1.0"
description = "Public verification package for AMPERE corrected 40 ms appliance results"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

